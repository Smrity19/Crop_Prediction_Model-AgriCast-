<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ML API</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="login">
    <h1>Crop Prediction Model</h1>
    <form action="{{ url_for('predict')}}" method="post">
        <input type="text" name="Nitrogen" placeholder="Nitrogen" required="required"/><br>
        <input type="text" name="Phosphorus" placeholder="Phosphorus" required="required"/><br>
        <input type="text" name="Potassium" placeholder="Potassium" required="required"/><br>
        <input type="text" name="Temperature" placeholder="Temperature" required="required"/><br>
        <input type="text" name="Humidity" placeholder="Humidity" required="required"/><br>
        <input type="text" name="pH" placeholder="pH" required="required"/><br>
        <input type="text" name="Rainfall" placeholder="Rainfall" required="required"/><br>
        <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>


    </form>
    <h1 id="prediction">{{ prediction_text }}</h1>
</div>
</body>
</html>
